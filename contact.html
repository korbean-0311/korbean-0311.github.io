<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Young-Seok Lee</title>
  <meta name="description" content="Contact information and lab location." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div data-mount-nav></div>

  <main>
    <header class="page-header">
      <h1>Contact</h1>
      <hr class="page-header__rule" />
    </header>

    <section>
      <div class="contact-grid">
        <div class="contact-info">
          <div class="contact-info__row">
            <span class="contact-info__label">Email</span>
            <span class="contact-info__value">ryanlee <em style="font-style:normal;color:var(--text-secondary)">at</em> snu.ac.kr</span>
          </div>
          <div class="contact-info__row">
            <span class="contact-info__label">Lab</span>
            <span class="contact-info__value">
              <a href="http://wfl.snu.ac.kr" target="_blank" rel="noopener">Wave Fusion Lab.<svg class="ext-link-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></a>
            </span>
          </div>
          <div class="contact-info__row">
            <span class="contact-info__label">LinkedIn</span>
            <span class="contact-info__value">
              <a href="https://www.linkedin.com/in/korbean" target="_blank" rel="noopener">linkedin.com/in/korbean<svg class="ext-link-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></a>
            </span>
          </div>
          <div class="contact-info__row">
            <span class="contact-info__label">Location</span>
            <span class="contact-info__value">
              INMC, Bldg #132,<br />
              Seoul National University,<br />
              1 Gwanak-ro, Gwanak-gu, Seoul 08826, Korea
            </span>
          </div>
        </div>

        <div class="contact-map">
          <iframe
            src="https://maps.google.com/maps?q=37.46686,126.95187&t=&z=17&ie=UTF8&iwloc=&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Seoul National University — INMC, Building 132"
          ></iframe>
        </div>
      </div>
    </section>
  </main>

  <div data-mount-footer></div>

  <script src="js/main.js"></script>
</body>
</html>
