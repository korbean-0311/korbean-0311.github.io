<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Keep search engines + AI crawlers out of the admin entry point. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Content editor — korbean</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="loading">Loading editor…</div>
  <!-- Sveltia CMS: a modern fork of Decap CMS, runs entirely in the browser.
       Auth: GitHub OAuth via Sveltia's free hosted proxy (gitauth.sveltia.dev).
       No backend, no DB — saves commit directly to the repo via the GitHub API.

       IMPORTANT: pin an explicit version instead of loading the unpinned
       "latest". Loading latest means an upstream release can silently break
       the editor (e.g., 0.170.6, released 2026-07-12, rendered list-item
       fields blank). Bump this deliberately after verifying a new version. -->
  <script src="https://unpkg.com/@sveltia/cms@0.170.5/dist/sveltia-cms.js"></script>
</body>
</html>
