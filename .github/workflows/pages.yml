name: Deploy to GitHub Pages

# Replaces GitHub's auto-generated "pages build and deployment" workflow
# (Settings -> Pages -> Source: GitHub Actions).
#
# WHY THIS EXISTS
#   Owning the deploy workflow (instead of GitHub's auto-generated legacy one)
#   keeps a single pipeline on each push and makes the deploy step inspectable.
#   Note that the 10-minute deploy timeout is NOT adjustable — see the note on
#   the deploy step below.
#
#   The site is plain static HTML (no Jekyll config, no front matter), so the
#   repository is uploaded as-is. upload-pages-artifact already excludes
#   .git and .github.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue them so the newest commit still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # NOTE: the action caps `timeout` at 600000 ms (10 min) — passing more is
        # silently clamped ("timeout value is greater than the allowed maximum"),
        # so a slow Pages queue cannot be waited out from here. If a deploy fails
        # with "Timeout reached, aborting!", the deployment never left
        # `deployment_queued` on GitHub's side; re-run once the queue recovers.
