name: Build llms-full.txt & AI fallbacks

on:
  push:
    branches: [main]
    # Re-run whenever anything llms-full.txt is built from changes: the JSON
    # data, the hand-written prose in the three pages (About me, contact,
    # section titles), the hand-written llms.txt, or the scripts themselves.
    # The bot's own auto-commit cannot re-trigger this: pushes made with the
    # workflow's GITHUB_TOKEN never start new workflow runs, and the job below
    # also skips itself when the actor is the bot.
    paths:
      - 'data/**'
      - 'index.html'
      - 'academics.html'
      - 'contact.html'
      - 'llms.txt'
      - 'scripts/build-llms.mjs'
      - 'scripts/build-prerender.mjs'
      - 'scripts/check-ai-sync.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/build-llms.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-llms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN; we have contents:write permission.
          persist-credentials: true

      # Pages first: build-llms.mjs reads the About-me text, the profile card
      # and the contact details out of the rendered pages.
      - name: Render static content into the HTML pages
        run: node scripts/build-prerender.mjs

      - name: Generate llms-full.txt
        run: node scripts/build-llms.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain llms-full.txt *.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add llms-full.txt *.html
            git commit -m "chore: regenerate llms-full.txt & AI fallbacks"
            git push
          else
            echo "Generated content is up to date — nothing to commit."
          fi

      # Last, so the regenerated files are committed even when this fails. What
      # it can still catch is drift in the hand-written llms.txt or Site guide
      # <nav>; a failure turns the run red and GitHub emails the owner.
      - name: Check AI docs against the pages
        run: node scripts/check-ai-sync.mjs
