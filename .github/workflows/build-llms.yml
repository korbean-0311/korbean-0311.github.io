name: Build llms-full.txt & AI fallbacks

on:
  push:
    branches: [main]
    # Re-run whenever anything the generated files are built from changes: the
    # JSON data, the hand-written prose in the three pages (About me, contact,
    # section titles), or the scripts. llms.txt and js/main.js are listed so a
    # hand edit to a generated part is put back.
    # The bot's own auto-commit cannot re-trigger this: pushes made with the
    # workflow's GITHUB_TOKEN never start new workflow runs, and the job below
    # also skips itself when the actor is the bot.
    paths:
      - 'data/**'
      - 'index.html'
      - 'academics.html'
      - 'contact.html'
      - 'llms.txt'
      - 'js/main.js'
      - 'scripts/build-llms.mjs'
      - 'scripts/build-prerender.mjs'
      - 'scripts/check-ai-sync.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/build-llms.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the deploy for the bot's own commit (see below)

concurrency:
  group: build-llms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN; we have contents:write permission.
          persist-credentials: true

      # Pages first: build-llms.mjs reads the About-me text, the profile card
      # and the contact details out of the rendered pages.
      - name: Render static content into the HTML pages
        run: node scripts/build-prerender.mjs

      - name: Generate llms-full.txt and llms.txt
        run: node scripts/build-llms.mjs

      # A push made with this workflow's token starts no other workflow, so the
      # deploy that ran for the triggering push shipped the pages as they were
      # before this rebuild. Start one more deploy for the regenerated commit
      # (it queues behind the first; until 2026-10 these commits went live
      # only with the next push).
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain llms-full.txt llms.txt js/main.js *.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add llms-full.txt llms.txt js/main.js *.html
            git commit -m "chore: regenerate llms-full.txt & AI fallbacks"
            git push
            gh workflow run pages.yml --ref main
          else
            echo "Generated content is up to date — nothing to commit."
          fi

      # Last, so the regenerated files are committed even when this fails.
      # Everything it checks is generated, so a failure here means a generator
      # no longer reads the markup correctly; the run turns red and GitHub
      # emails the owner.
      - name: Check AI docs against the pages
        run: node scripts/check-ai-sync.mjs
