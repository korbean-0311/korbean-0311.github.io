name: Build llms-full.txt

on:
  push:
    branches: [main]
    # Only re-run when JSON data, the generator script, or this workflow change.
    # The bot's auto-commit (which only touches llms-full.txt) will therefore
    # NOT re-trigger this workflow — preventing an infinite loop.
    paths:
      - 'data/**'
      - 'scripts/build-llms.mjs'
      - '.github/workflows/build-llms.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-llms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN; we have contents:write permission.
          persist-credentials: true

      - name: Generate llms-full.txt
        run: node scripts/build-llms.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain llms-full.txt)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add llms-full.txt
            git commit -m "chore: regenerate llms-full.txt"
            git push
          else
            echo "llms-full.txt is up to date — nothing to commit."
          fi
